name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev libwayland-dev
      - run: cargo test
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./bundle.sh && ditto -c -k --keepParent target/Swatchbar.app target/Swatchbar-macos.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: ./bundle_windows.ps1
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./bundle_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: swatchbar-${{ matrix.os }}
          path: |
            target/Swatchbar-macos.zip
            target/Swatchbar-windows.zip
            target/swatchbar-linux-*.tar.gz

  # Pushing a tag like v0.1.0 attaches the three binaries to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
